name: Convert I Was Painted Shut cover

on:
  push:
    paths:
      - 'assets/i-was-painted-shut.b64'
      - '.github/workflows/convert-painted-shut.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert base64 cover to JPEG
        run: |
          base64 -d assets/i-was-painted-shut.b64 > assets/i-was-painted-shut.jpg
          file assets/i-was-painted-shut.jpg
      - name: Commit JPEG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/i-was-painted-shut.jpg
          git diff --cached --quiet || git commit -m 'Add I Was Painted Shut cover as JPEG'
          git push
